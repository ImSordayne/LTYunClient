name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-x64-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64

      - name: Install webview
        shell: cmd
        run: |
          if not exist "${{ runner.temp }}/webview" mkdir "${{ runner.temp }}/webview"
          curl -L https://github.com/webview/webview/archive/0.12.0.tar.gz -o webview.tgz && tar -xzf webview.tgz -C ${{ runner.temp }}/webview/ && cd ${{ runner.temp }}/webview/webview-0.12.0 && cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RELEASE && cmake --install build --prefix ${{ runner.temp }}/webview/installed

      - name: Configure
        shell: cmd
        run: |
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -G Ninja -DCMAKE_BUILD_TYPE=RELEASE -DCMAKE_PREFIX_PATH="${{ runner.temp }}/webview/installed"

      - name: Build
        shell: cmd
        run: cmake --build ${{ github.workspace }}/build

      - name: Install
        shell: cmd
        run: cmake --install ${{ github.workspace }}/build --prefix ${{ runner.temp }}/Install

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ runner.temp }}/Install

  build-x86-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x86

      - name: Install webview
        shell: cmd
        run: |
          if not exist "${{ runner.temp }}/webview" mkdir "${{ runner.temp }}/webview"
          curl -L https://github.com/webview/webview/archive/0.12.0.tar.gz -o webview.tgz && tar -xzf webview.tgz -C ${{ runner.temp }}/webview/ && cd ${{ runner.temp }}/webview/webview-0.12.0 && cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RELEASE && cmake --install build --prefix ${{ runner.temp }}/webview/installed

      - name: Configure
        shell: cmd
        run: |
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -G Ninja -DCMAKE_BUILD_TYPE=RELEASE -DCMAKE_PREFIX_PATH="${{ runner.temp }}/webview/installed"

      - name: Build
        shell: cmd
        run: cmake --build ${{ github.workspace }}/build

      - name: Install
        shell: cmd
        run: cmake --install ${{ github.workspace }}/build --prefix ${{ runner.temp }}/Install

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86
          path: ${{ runner.temp }}/Install

  build-x64-linux:
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libwebkit2gtk-4.0-dev libfuse2

      - name: Install linuxdeploy
        run: |
          curl -L -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          sudo mv linuxdeploy /usr/local/bin/linuxdeploy
          linuxdeploy --version

      - name: Install webview
        run: |
          curl -L https://github.com/webview/webview/archive/0.12.0.tar.gz -o webview.tgz
          mkdir -p ${{ runner.temp }}/webview
          tar -xzf webview.tgz -C ${{ runner.temp }}/webview/
          cd ${{ runner.temp }}/webview/webview-0.12.0
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RELEASE
          cmake --install build --prefix ${{ runner.temp }}/webview/installed

      - name: Configure
        run: |
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -G Ninja -DCMAKE_BUILD_TYPE=RELEASE -DCMAKE_PREFIX_PATH="${{ runner.temp }}/webview/installed"

      - name: Build
        run: cmake --build ${{ github.workspace }}/build

      - name: Install
        run: cmake --install ${{ github.workspace }}/build --prefix ${{ runner.temp }}/Install

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ runner.temp }}/Install

  
  build-x86-linux:
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v6

      - name: Install 32-bit system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-multilib g++-multilib libgtk-3-dev:i386 libwebkit2gtk-4.0-dev:i386 libfuse2:i386

      - name: Install linuxdeploy
        run: |
          curl -L -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-i386.AppImage
          chmod +x linuxdeploy
          sudo mv linuxdeploy /usr/local/bin/linuxdeploy
          linuxdeploy --version

      - name: Install webview
        run: |
          curl -L https://github.com/webview/webview/archive/0.12.0.tar.gz -o webview.tgz
          mkdir -p ${{ runner.temp }}/webview
          tar -xzf webview.tgz -C ${{ runner.temp }}/webview/
          cd ${{ runner.temp }}/webview/webview-0.12.0
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RELEASE -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32
          cmake --install build --prefix ${{ runner.temp }}/webview/installed

      - name: Configure
        run: |
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -G Ninja -DCMAKE_BUILD_TYPE=RELEASE -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_PREFIX_PATH="${{ runner.temp }}/webview/installed"

      - name: Build
        run: cmake --build ${{ github.workspace }}/build

      - name: Install
        run: cmake --install ${{ github.workspace }}/build --prefix ${{ runner.temp }}/Install

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86
          path: ${{ runner.temp }}/Install


  build-arm64-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install webview
        run: |
          curl -L https://github.com/webview/webview/archive/0.12.0.tar.gz -o webview.tgz
          mkdir -p ${{ runner.temp }}/webview
          tar -xzf webview.tgz -C ${{ runner.temp }}/webview/
          cd ${{ runner.temp }}/webview/webview-0.12.0
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RELEASE
          cmake --install build --prefix ${{ runner.temp }}/webview/installed

      - name: Configure
        run: |
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -G Ninja -DCMAKE_BUILD_TYPE=RELEASE -DCMAKE_PREFIX_PATH="${{ runner.temp }}/webview/installed"

      - name: Build
        run: cmake --build ${{ github.workspace }}/build

      - name: Install
        run: cmake --install ${{ github.workspace }}/build --prefix ${{ runner.temp }}/Install

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ${{ runner.temp }}/Install


  build-x64-macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v6

      - name: Install webview
        run: |
          curl -L https://github.com/webview/webview/archive/0.12.0.tar.gz -o webview.tgz
          mkdir -p ${{ runner.temp }}/webview
          tar -xzf webview.tgz -C ${{ runner.temp }}/webview/
          cd ${{ runner.temp }}/webview/webview-0.12.0
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RELEASE
          cmake --install build --prefix ${{ runner.temp }}/webview/installed

      - name: Configure
        run: |
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -G Ninja -DCMAKE_BUILD_TYPE=RELEASE -DCMAKE_PREFIX_PATH="${{ runner.temp }}/webview/installed"

      - name: Build
        run: cmake --build ${{ github.workspace }}/build

      - name: Install
        run: cmake --install ${{ github.workspace }}/build --prefix ${{ runner.temp }}/Install

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: ${{ runner.temp }}/Install
